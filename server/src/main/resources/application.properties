server.port=5000

# Database Configuration (Docker PostgreSQL 16)
spring.datasource.url=jdbc:postgresql://localhost:5432/swaply_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically initialize schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Configuration (HMAC-SHA256, at least 256 bits)
jwt.secret=super_secret_swaply_jwt_key_that_is_at_least_256_bits_long_for_security_123_abc
jwt.expiration=604800000

# File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# File Storage path for uploads
file.upload-dir=public/uploads

